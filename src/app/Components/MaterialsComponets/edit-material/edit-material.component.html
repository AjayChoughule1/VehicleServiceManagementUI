<div *ngIf="material" class="container">
    <h2 class="mt-4 mb-4">Edit Material</h2>
    <div class="mb-3">
        <label for="itemName" class="form-label">Item Name:</label>
        <input type="text" id="itemName" [(ngModel)]="material.ItemName" class="form-control">
    </div>
    <div class="mb-3">
        <label for="cost" class="form-label">Cost:</label>
        <input type="text" id="cost" [(ngModel)]="material.Cost" class="form-control">
    </div>
    
    <button type="button" (click)="saveMaterial()" class="btn btn-primary">Save</button>
    
</div>
