<ng-container *ngIf="Material">
    <div class="container mt-5">
      <button type="button" (click)="navigateToAddMaterialForm()" class="btn btn-primary">Add Material</button>
      <br /><br />
      <table class="table align-middle mb-0 bg-white container">
        <thead class="bg-light">
          <tr>
            <th>Item Id</th>
            <th>Item Name</th>
            <th>Cost</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let material of Material">
            <td>
              <div class="d-flex align-items-center">
                <div class="ms-3">
                  <p class="fw-bold mb-1">{{ material.ItemID }}</p>
                </div>
              </div>
            </td>
            <td>
              <p class="fw-normal mb-1">{{ material.ItemName }}</p>
            </td>
            <td>
              <p class="fw-normal mb-1">{{ material.Cost }}</p>
            </td>
           
            <td>
              <button type="button" class="btn btn-warning btn-sm btn-rounded"
                (click)="navigateToEditForm(material.ItemID)">
                Edit
              </button>
              &nbsp;
              <button type="button" class="btn btn-danger btn-sm btn-rounded"
                (click)="navigateToDeleteForm(material.ItemID)">
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>
