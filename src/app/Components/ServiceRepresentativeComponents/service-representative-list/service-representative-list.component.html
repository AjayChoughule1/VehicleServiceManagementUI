<ng-container *ngIf="ServiceRepresentative">
    <div class="container mt-5">
      <button type="button" (click)="navigateToAddServiceRepresentativeForm()" class="btn btn-primary">Add ServiceRepresentative</button>
      <br/><br/>
    <table class="table align-middle mb-0 bg-white container">
      <thead class="bg-light">
        <tr>
          <th>Representative Id</th>
          <th>FirstName</th>
          <th>LastName</th>
          <th>ContactNumber</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let serviceRepresentative of ServiceRepresentative">
          <td>
            <div class="d-flex align-items-center">
              <div class="ms-3">
                <p class="fw-bold mb-1">{{ serviceRepresentative.RepresentativeID }}</p>
              </div>
            </div>
          </td>
          <td>
            <p class="fw-normal mb-1">{{ serviceRepresentative.FirstName }}</p>
          </td>
          <td>
            <p class="fw-normal mb-1">{{ serviceRepresentative.LastName }}</p>
          </td>
          <td>
            <p class="fw-normal mb-1">{{ serviceRepresentative.ContactNumber }}</p>
          </td>
          <td>
            <p class="fw-normal mb-1">{{ serviceRepresentative.Email }}</p>
          </td>
          <td>
            <button type="button" class="btn btn-warning btn-sm btn-rounded" (click)="navigateToEditForm(serviceRepresentative.RepresentativeID)">
              Edit
            </button>
            &nbsp;
            <button type="button" class="btn btn-danger btn-sm btn-rounded" (click)="navigateToDeleteForm(serviceRepresentative.RepresentativeID)">
                Delete
              </button>
          </td>
        </tr>
      </tbody>
    </table>
    </div>
  </ng-container>
