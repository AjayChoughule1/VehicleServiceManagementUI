<div *ngIf="serviceRepresentative" class="container">
    <h2 class="mt-4 mb-4">Edit ServiceRepresentative</h2>
    <div class="mb-3">
        <label for="firstName" class="form-label">First Name:</label>
        <input type="text" id="firstName" [(ngModel)]="serviceRepresentative.FirstName" class="form-control">
    </div>
    <div class="mb-3">
        <label for="lastName" class="form-label">Last Name:</label>
        <input type="text" id="lastName" [(ngModel)]="serviceRepresentative.LastName" class="form-control">
    </div>
    <div class="mb-3">
        <label for="contactNumber" class="form-label">Contact Number:</label>
        <input type="text" id="contactNumber" [(ngModel)]="serviceRepresentative.ContactNumber" class="form-control">
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="text" id="email" [(ngModel)]="serviceRepresentative.Email" class="form-control">
    </div>
    
    <button type="button" (click)="saveServiceRepresentative()" class="btn btn-primary">Save</button>
    
</div>
