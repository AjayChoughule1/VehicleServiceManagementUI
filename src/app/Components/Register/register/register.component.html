   <div class="background-image">
    <div class="py-3 py-md-5">
      <div class="container">
        <div class="row justify-content-md-center">
          <div class="col-12 col-md-11 col-lg-8 col-xl-7 col-xxl-6">
            <div class="loginBox p-4 p-md-5 rounded shadow-sm">
              <div class="row">
                <div class="col-12">
                  <div class="mb-5">
                    <h3>Sign Up</h3>
                  </div>
                </div>
              </div>
              <form #form="ngForm" (ngSubmit)="onFormSubmit()" novalidate>
                <div class="row gy-3 gy-md-4 overflow-hidden">
                    <div class="mb-3 row">
                  <div class="col">
                    <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="firstName" id="firstName" [(ngModel)]="model.FirstName" required minlength="2">
                    <div *ngIf="form.submitted && form.controls['firstName'].invalid" class="text-danger">Please enter a valid first name.</div>
                  </div>
                  <div class="col">
                    <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="lastName" id="lastName" [(ngModel)]="model.LastName" required minlength="2">
                    <div *ngIf="form.submitted && form.controls['lastName'].invalid" class="text-danger">Please enter a valid last name.</div>
                  </div>
                    </div>
                  <div class="col-12">
                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" name="email" id="email" placeholder="name@example.com" [(ngModel)]="model.Email" required email>
                    <div *ngIf="form.submitted && form.controls['email'].invalid" class="text-danger">Please enter a valid email.</div>
                  </div>
                  <div class="col-12">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" name="address" id="address" [(ngModel)]="model.Address">
                  </div>
                  <div class="col-12">
                    <label for="mobile" class="form-label">Mobile <span class="text-danger">*</span></label>
                    <input type="tel" class="form-control" name="mobile" id="mobile" [(ngModel)]="model.Mobile" required minlength="10" maxlength="10" pattern="[0-9]*">
                    <div *ngIf="form.submitted && form.controls['mobile'].invalid" class="text-danger">Please enter a valid 10-digit mobile number.</div>
                  </div>
                  <div class="col-12">
                    <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" name="password" id="password" [(ngModel)]="model.Password" required minlength="6">
                    <div *ngIf="form.submitted && form.controls['password'].invalid" class="text-danger">Please enter a valid password with at least 6 characters.</div>
                  </div>
                  <div class="col-12">
                    <div class="d-grid">
                      <button type="submit" class="btn btn-lg btn-primary">Sign Up now</button>
                      <div class="text-center mt-3">
                        Already have an account? <a style="color: blue;cursor: pointer;" (click)="goToLogin()">Login</a>
                      </div>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
