<div *ngIf="model" class="container">
    <h2 class="mt-4 mb-4">Delete Customer</h2>
    <div class="mb-3">
        <label for="customerId" class="form-label">Customer ID:</label>
        <input type="text" id="customerId" [(ngModel)]="model.CustomerId" class="form-control" disabled>
    </div>
    <div class="mb-3">
        <label for="firstName" class="form-label">First Name:</label>
        <input type="text" id="firstName" [(ngModel)]="model.FirstName" class="form-control" disabled>
    </div>
    <div class="mb-3">
        <label for="lastName" class="form-label">Last Name:</label>
        <input type="text" id="lastName" [(ngModel)]="model.LastName" class="form-control" disabled>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="text" id="email" [(ngModel)]="model.Email" class="form-control" disabled>
    </div>
    <div class="mb-3">
        <label for="address" class="form-label">Address:</label>
        <input type="text" id="address" [(ngModel)]="model.Address" class="form-control" disabled>
    </div>
    <div class="mb-3">
        <label for="mobile" class="form-label">Mobile:</label>
        <input type="text" id="mobile" [(ngModel)]="model.Mobile" class="form-control" disabled>
    </div>

    <button type="button" (click)="onFormSubmit()" class="btn btn-danger">Delete</button>
</div>
