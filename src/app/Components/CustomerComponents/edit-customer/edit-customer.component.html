<div *ngIf="customer" class="container">
    <h2 class="mt-4 mb-4">Edit Customer</h2>
    <div class="mb-3">
        <label for="firstName" class="form-label">First Name:</label>
        <input type="text" id="firstName" [(ngModel)]="customer.FirstName" class="form-control">
    </div>
    <div class="mb-3">
        <label for="lastName" class="form-label">Last Name:</label>
        <input type="text" id="lastName" [(ngModel)]="customer.LastName" class="form-control">
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" id="email" [(ngModel)]="customer.Email" class="form-control">
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password:</label>
        <input type="password" id="password" [(ngModel)]="customer.Password" class="form-control">
    </div>
    <div class="mb-3">
        <label for="address" class="form-label">Address:</label>
        <input type="text" id="address" [(ngModel)]="customer.Address" class="form-control">
    </div>
    <div class="mb-3">
        <label for="mobile" class="form-label">Mobile:</label>
        <input type="text" id="mobile" [(ngModel)]="customer.Mobile" class="form-control">
    </div>

    <button type="button" (click)="saveCustomer()" class="btn btn-primary">Save</button>
</div>
