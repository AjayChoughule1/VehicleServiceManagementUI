<div class="container mt-5">
    <h2>Add Vehicle</h2>
    <form (ngSubmit)="onFormSubmit()">
      <div class="mb-3">
        <label for="vehicleCategory" class="form-label">Vehicle Category</label>
        <input type="text" class="form-control" id="vehicleCategory" [(ngModel)]="model.VehicleCategory" name="vehicleCategory" required>
      </div>
      <div class="mb-3">
        <label for="vehicleRegNo" class="form-label">Vehicle Registration Number</label>
        <input type="text" class="form-control" id="vehicleRegNo" [(ngModel)]="model.VehicleRegNo" name="vehicleRegNo" required>
      </div>
      <div class="mb-3">
        <label for="vehicleNumber" class="form-label">Vehicle Number</label>
        <input type="text" class="form-control" id="vehicleNumber" [(ngModel)]="model.VehicleNumber" name="vehicleNumber" required>
      </div>
      <div class="mb-3">
        <label for="vehicleModel" class="form-label">Vehicle Model</label>
        <input type="text" class="form-control" id="vehicleModel" [(ngModel)]="model.VehicleModel" name="vehicleModel" required>
      </div>
      <div class="mb-3">
        <label for="vehicleBrand" class="form-label">Vehicle Brand</label>
        <input type="text" class="form-control" id="vehicleBrand" [(ngModel)]="model.VehicleBrand" name="vehicleBrand" required>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
